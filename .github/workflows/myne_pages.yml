name: Publish KR paper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myne-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Lean modules for the dependency graph
        uses: leanprover/lean-action@v1
        with:
          build-args: Final
          test: 'false'
          lint: 'false'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Myne
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/James-Oswald/Myne.git "$RUNNER_TEMP/myne-source"
          make -C "$RUNNER_TEMP/myne-source" CC=cc
          "$RUNNER_TEMP/myne-source/bin/myne" -i . --elaborated-deps
          cp src/kr.bst myne-out/tex/src/kr.bst

      - name: Compile KR PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: src/main.tex
          working_directory: myne-out/tex
          work_in_root_file_dir: 'false'

      - name: Include PDF in site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          site = Path('myne-out/html')
          pdf = site / 'src/main.pdf'
          pdf.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('myne-out/tex/main.pdf', pdf)
          old = 'href="../tex/src/main.pdf"'
          for page in site.rglob('*.html'):
              content = page.read_text(encoding='utf-8')
              page.write_text(content.replace(old, 'href="src/main.pdf"'), encoding='utf-8')
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: myne-out/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
