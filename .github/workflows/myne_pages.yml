name: Publish Myne documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myne-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Lean modules for the dependency graph
        uses: leanprover/lean-action@v1
        with:
          build-args: Final
          test: 'false'
          lint: 'false'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and upload site with PDF
        uses: James-Oswald/Myne/.github/actions/build-myne@main
        with:
          project-directory: src
          output-directory: myne-out
          build-pdf: true
          tex-main-file: Final.tex
          elaborated-deps: true
          upload-pages-artifact: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
